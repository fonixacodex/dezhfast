# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dezh
      POSTGRES_PASSWORD: dezh
      POSTGRES_DB: dezh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dezh -d dezh"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Dezh
      APP_ENV: dev
      DEBUG: "true"
      SECRET_KEY: change-me-in-production-please-use-a-real-secret
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE_NAME: dezh
      DB_USERNAME: dezh
      DB_PASSWORD: dezh
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./framework:/app/framework
    restart: unless-stopped

  worker:
    build: .
    command: arq app.modules.jobs.worker.WorkerSettings
    environment:
      APP_ENV: dev
      DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE_NAME: dezh
      DB_USERNAME: dezh
      DB_PASSWORD: dezh
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: